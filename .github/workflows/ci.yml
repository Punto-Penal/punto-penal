# Corre en cada PR y en cada push a main: lint, tipos, tests y build de todo el monorepo.
# Node sale de .nvmrc y pnpm de packageManager en package.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Instala pnpm y Node, y corre pnpm install --frozen-lockfile.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
