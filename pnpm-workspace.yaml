packages:
  - apps/*
  - packages/*

# Dependencias con scripts de instalación que no hace falta correr.
# sharp trae binarios precompilados; unrs-resolver lo usa ESLint.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.13'
  - '@turbo/darwin-arm64@2.11.13'
  - '@turbo/linux-64@2.11.13'
  - '@turbo/linux-arm64@2.11.13'
  - '@turbo/windows-64@2.11.13'
  - '@turbo/windows-arm64@2.11.13'
  - turbo@2.11.13
